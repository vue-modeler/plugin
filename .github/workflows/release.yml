name: Release

on:
  push:
    branches:
      - main
      - beta

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required for npm Trusted Publishing (OIDC).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      # Do not set registry-url / NODE_AUTH_TOKEN here: that writes a classic
      # token into ~/.npmrc and forces npm publish onto the EOTP path.
      # Publish uses Trusted Publishing (OIDC) via semantic-release → npm CLI.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          # Intentionally no NPM_TOKEN / NODE_AUTH_TOKEN: classic tokens hit
          # EOTP under "disallow bypass 2fa". Trusted Publisher must allow
          # direct `npm publish` for vue-modeler/plugin + release.yml.
        run: pnpm semantic-release
